version: 2.1

# Pipeline for canada-jp-portal
#   every push:  test-backend, test-frontend, validate-terraform
#   main only:   build-images -> deploy-stg (hiromaki58.com) -> hold-prod (manual approval) -> deploy-prod
# The images are built once and the same images are pushed to staging and, after approval, to production.

# AWS credentials (never commit them). Each deploy job checks that it runs as the expected IAM user before
# pushing anything, so a missing or wrong credential stops the job instead of deploying to the other environment.
#   Staging:    project environment variables (Project Settings > Environment Variables)
#                 AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  IAM user canada-jp-portal-stg-circleci-deploy
#                 (infra/stg/shared: circleci_access_key_id, circleci_secret_access_key)
#   Production: context "canada-jp-portal-prod" (Organization Settings > Contexts; restrict who may use it)
#                 AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  IAM user canada-jp-portal-prod-circleci-deploy
#                 (infra/prod/shared: circleci_access_key_id, circleci_secret_access_key)
# ECR repositories, ECS cluster and service names are not secret: they are the deploy job parameters below
# (same values as the outputs of infra/<env>/shared and infra/<env>/app).
# Application settings and secrets (DB_*, APP_*, SPRING_MAIL_*) belong to the ECS task definition, not to CircleCI.

executors:
    java-executor:
        docker:
            # Tests use an in-memory H2 database (src/test/resources/application.properties): no DB container needed
            -   image: cimg/openjdk:17.0
        working_directory: ~/project
    node-executor:
        docker:
            -   image: cimg/node:18.20
        working_directory: ~/project
    deploy-executor:
        docker:
            -   image: cimg/base:stable
        working_directory: ~/project
        environment:
            # All layers in infra/ use this region
            AWS_REGION: us-east-1
    terraform-executor:
        docker:
            -   image: cimg/base:stable
        working_directory: ~/project
        environment:
            # Same version as used locally; infra/*/*/versions.tf requires >= 1.10
            TERRAFORM_VERSION: 1.16.6

commands:
    install-aws-cli:
        steps:
            -   run:
                    name: Install AWS CLI
                    command: |
                        sudo apt-get update && sudo apt-get install -y unzip curl
                        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                        unzip -q awscliv2.zip
                        ./aws/install --install-dir "$HOME/aws-cli" --bin-dir "$HOME/bin"
                        rm -rf awscliv2.zip aws
                        echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"
                        source "$BASH_ENV"
                        aws --version

jobs:
    test-backend:
        executor: java-executor
        steps:
            - checkout
            -   restore_cache:
                    keys:
                        - gradle-v1-{{ checksum "backend/build.gradle" }}-{{ checksum "backend/gradle/wrapper/gradle-wrapper.properties" }}
                        - gradle-v1-
            -   run:
                    name: Run backend tests
                    working_directory: backend
                    command: ./gradlew --no-daemon check
            -   save_cache:
                    key: gradle-v1-{{ checksum "backend/build.gradle" }}-{{ checksum "backend/gradle/wrapper/gradle-wrapper.properties" }}
                    paths:
                        - ~/.gradle/caches
                        - ~/.gradle/wrapper
            -   store_test_results:
                    path: backend/build/test-results/test
            -   store_artifacts:
                    path: backend/build/reports/tests/test
                    destination: backend-test-report

    test-frontend:
        executor: node-executor
        steps:
            - checkout
            -   restore_cache:
                    keys:
                        - npm-v1-{{ checksum "frontend/package-lock.json" }}
            -   run:
                    name: Install dependencies
                    working_directory: frontend
                    command: npm ci
            -   save_cache:
                    key: npm-v1-{{ checksum "frontend/package-lock.json" }}
                    paths:
                        - ~/.npm
            -   run:
                    name: Type check
                    working_directory: frontend
                    command: npm run typecheck
            -   run:
                    name: Lint
                    working_directory: frontend
                    command: npm run lint
            -   run:
                    name: Run frontend tests
                    working_directory: frontend
                    command: npx vitest run
            -   run:
                    name: Build
                    working_directory: frontend
                    command: npm run build

    # Static checks only: no AWS credentials are used and no remote state is read
    validate-terraform:
        executor: terraform-executor
        steps:
            - checkout
            -   run:
                    name: Install Terraform
                    command: |
                        base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
                        zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
                        curl -fsSLO "$base/$zip"
                        curl -fsSLO "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
                        # Fail unless the downloaded archive matches the published checksum
                        grep " $zip\$" "terraform_${TERRAFORM_VERSION}_SHA256SUMS" | sha256sum -c -
                        mkdir -p "$HOME/bin"
                        unzip -q "$zip" -d "$HOME/bin"
                        rm -f "$zip" "terraform_${TERRAFORM_VERSION}_SHA256SUMS"
                        echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"
                        source "$BASH_ENV"
                        terraform version
            -   run:
                    name: Check formatting
                    command: terraform fmt -check -recursive -diff infra
            -   run:
                    name: Validate each layer
                    command: |
                        for env in stg prod; do
                          for layer in shared network dns database mail app; do
                            echo "== infra/$env/$layer"
                            terraform -chdir="infra/$env/$layer" init -backend=false -input=false
                            terraform -chdir="infra/$env/$layer" validate
                          done
                        done

    # Builds the images once (no AWS access) and keeps them in the workspace for both deploy jobs
    build-images:
        executor: deploy-executor
        steps:
            - checkout
            - setup_remote_docker
            -   run:
                    name: Build Docker images
                    command: |
                        mkdir -p images
                        for app in backend frontend; do
                          docker build --platform linux/amd64 -t "$app:build" "./$app"
                          docker save "$app:build" | gzip > "images/$app.tar.gz"
                        done
            -   persist_to_workspace:
                    root: .
                    paths:
                        - images

    deploy:
        parameters:
            deploy_user:
                description: IAM user the credentials must belong to (infra/<env>/shared)
                type: string
            backend_repository:
                type: string
            frontend_repository:
                type: string
            ecs_cluster:
                type: string
            backend_service:
                type: string
            frontend_service:
                type: string
        executor: deploy-executor
        environment:
            BACKEND_REPOSITORY: << parameters.backend_repository >>
            FRONTEND_REPOSITORY: << parameters.frontend_repository >>
            ECS_CLUSTER: << parameters.ecs_cluster >>
            ECS_BACKEND_SERVICE: << parameters.backend_service >>
            ECS_FRONTEND_SERVICE: << parameters.frontend_service >>
        steps:
            -   attach_workspace:
                    at: .
            - setup_remote_docker
            - install-aws-cli
            -   run:
                    name: Check AWS identity
                    command: |
                        account_id=$(aws sts get-caller-identity --query Account --output text)
                        arn=$(aws sts get-caller-identity --query Arn --output text)
                        if [ "$arn" != "arn:aws:iam::${account_id}:user/<< parameters.deploy_user >>" ]; then
                          echo "The AWS credentials do not belong to << parameters.deploy_user >>; check the environment variables or context." >&2
                          exit 1
                        fi
                        echo "export REGISTRY=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$BASH_ENV"
                        echo "export IMAGE_TAG=${CIRCLE_SHA1:0:7}" >> "$BASH_ENV"
            -   run:
                    name: Push to Amazon ECR
                    command: |
                        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
                        for app in backend frontend; do
                          if [ "$app" = backend ]; then repository="$BACKEND_REPOSITORY"; else repository="$FRONTEND_REPOSITORY"; fi
                          gunzip -c "images/$app.tar.gz" | docker load
                          docker tag "$app:build" "$REGISTRY/$repository:$IMAGE_TAG"
                          docker tag "$app:build" "$REGISTRY/$repository:latest"
                          docker push "$REGISTRY/$repository:$IMAGE_TAG"
                          docker push "$REGISTRY/$repository:latest"
                        done
            -   run:
                    name: Deploy to Amazon ECS
                    command: |
                        for service in "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"; do
                          aws ecs update-service --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --service "$service" \
                            --force-new-deployment --query 'service.serviceName' --output text
                        done
                        aws ecs wait services-stable --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
                          --services "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"

workflows:
    ci:
        jobs:
            - test-backend
            - test-frontend
            - validate-terraform
            # Build and deploy only from main, and only after all checks passed
            -   build-images:
                    requires:
                        - test-backend
                        - test-frontend
                        - validate-terraform
                    filters:
                        branches:
                            only: main
            # Staging (hiromaki58.com): infra/stg; credentials from the project environment variables
            -   deploy:
                    name: deploy-stg
                    deploy_user: canada-jp-portal-stg-circleci-deploy
                    backend_repository: canada-jp-portal-stg-backend
                    frontend_repository: canada-jp-portal-stg-frontend
                    ecs_cluster: canada-jp-portal-stg
                    backend_service: canada-jp-portal-stg-backend
                    frontend_service: canada-jp-portal-stg-frontend
                    requires:
                        - build-images
                    filters:
                        branches:
                            only: main
            # Production waits until someone approves it in the CircleCI UI after checking staging
            -   hold-prod:
                    type: approval
                    requires:
                        - deploy-stg
                    filters:
                        branches:
                            only: main
            # Production: infra/prod; credentials from the "canada-jp-portal-prod" context
            -   deploy:
                    name: deploy-prod
                    context: canada-jp-portal-prod
                    deploy_user: canada-jp-portal-prod-circleci-deploy
                    backend_repository: canada-jp-portal-prod-backend
                    frontend_repository: canada-jp-portal-prod-frontend
                    ecs_cluster: canada-jp-portal-prod
                    backend_service: canada-jp-portal-prod-backend
                    frontend_service: canada-jp-portal-prod-frontend
                    requires:
                        - hold-prod
                    filters:
                        branches:
                            only: main
